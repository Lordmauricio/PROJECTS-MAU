# Ningún secreto está escrito en este archivo: todos se leen del entorno
# (o de un archivo `.env` junto a este compose, que está en .gitignore).
# La sintaxis `${VAR:?mensaje}` hace que `docker compose` falle de entrada
# si la variable no está definida, en vez de arrancar con un valor por
# defecto que sería idéntico y público en todos los despliegues.
#
# Para levantar el stack, creá un `.env` en la raíz con:
#   POSTGRES_PASSWORD=...        # openssl rand -base64 32
#   APP_USER_PASSWORD=...        # openssl rand -base64 32
#   JWT_ACCESS_SECRET=...        # openssl rand -base64 32
#   JWT_REFRESH_SECRET=...       # openssl rand -base64 32
#   EMAIL_SMTP_HOST=...
#
# PUERTOS: Postgres y Redis se publican SOLO en 127.0.0.1. En un servidor con
# IP pública, `"5432:5432"` (que es lo que Docker entiende como 0.0.0.0)
# habría dejado la base de datos accesible desde internet — y Redis, que no
# tiene contraseña, todavía peor. Siguen siendo alcanzables desde el host
# (psql/redis-cli) y entre contenedores por la red interna de compose.
# `HTTP_BIND_ADDR` hace lo mismo con backend y frontend: por defecto solo
# loopback, pensado para tener un reverse proxy con TLS en el mismo host.
# Poner 0.0.0.0 únicamente si se decide exponerlos directo, sin proxy.
# El driver de logs por defecto de Docker (json-file) crece sin límite: en un
# servidor de larga vida, los logs terminan llenando el disco y tirando abajo
# todo el stack. 3 archivos de 10 MB por servicio acotan eso.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el .env de la raíz}
      POSTGRES_DB: kipu_saas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kipu_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kipu_redis_data:/data
    # `appendonly yes`: sin AOF, un reinicio del contenedor pierde los jobs
    # de BullMQ que estuvieran en cola (emails, auditoría) desde el último
    # snapshot RDB.
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ./backend
    ports:
      - "${HTTP_BIND_ADDR:-127.0.0.1}:4200:4200"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el .env de la raíz}@postgres:5432/kipu_saas?schema=public
      # `app_user` es el rol SIN BYPASSRLS con el que corre la aplicación.
      # La migración lo crea sin contraseña; `docker-entrypoint.sh` se la
      # asigna con `db:provision-roles` a partir de APP_USER_PASSWORD.
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?definí APP_USER_PASSWORD en el .env de la raíz}
      RUNTIME_DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?definí APP_USER_PASSWORD en el .env de la raíz}@postgres:5432/kipu_saas?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?definí JWT_ACCESS_SECRET en el .env de la raíz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?definí JWT_REFRESH_SECRET en el .env de la raíz}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 4200
      NODE_ENV: ${NODE_ENV:-production}
      # Orígenes del frontend habilitados. En este compose el frontend corre
      # en localhost:3000; en un despliegue real hay que apuntarlo al dominio.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Este compose expone el backend directo, sin reverse proxy delante.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@kipu-saas.local}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:?definí EMAIL_SMTP_HOST (con NODE_ENV=production el backend exige SMTP real; para una prueba local poné NODE_ENV=development y EMAIL_PROVIDER=console)}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Readiness: incluye Postgres y Redis, así el frontend no arranca
      # apuntando a un backend que todavía no puede responder.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200}
    ports:
      - "${HTTP_BIND_ADDR:-127.0.0.1}:3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  kipu_postgres_data:
  kipu_redis_data:
